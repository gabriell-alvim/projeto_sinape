<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATA SIN — Entrar</title>
<style>
:root {
  --teal: #0d5c63;
  --teal-mid: #1a8a8a;
  --teal-l: #e6f4f4;
  --slate: #1e293b;
  --slate-mid: #475569;
  --slate-l: #94a3b8;
  --border: #d1dae6;
  --bg: #f1f5f9;
  --white: #ffffff;
  --red: #b91c1c;
  --red-l: #fef2f2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--slate);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  width: 100%;
  max-width: 400px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px 24px;
  box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
}
.brand {
  color: var(--teal);
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: .04em;
  margin-bottom: 6px;
}
h1 { font-size: 1.35rem; margin-bottom: 6px; }
.hint { font-size: .82rem; color: var(--slate-mid); margin-bottom: 18px; line-height: 1.5; }
label { display: block; font-size: .78rem; font-weight: 700; color: var(--slate-mid); margin-bottom: 6px; }
input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: .9rem;
  margin-bottom: 14px;
}
input:focus { outline: none; border-color: var(--teal-mid); box-shadow: 0 0 0 3px var(--teal-l); }
button {
  width: 100%;
  border: none;
  border-radius: 8px;
  padding: 11px 14px;
  font-size: .88rem;
  font-weight: 700;
  background: var(--teal);
  color: #fff;
  cursor: pointer;
}
button:hover { background: var(--teal-mid); }
.btn-microsoft {
  display:flex; align-items:center; justify-content:center; gap:10px;
  border:1px solid #8c8c8c; border-radius:4px; padding:10px 12px;
  font-size:.82rem; font-weight:600; color:#1b1b1b; background:#fff;
  text-decoration:none; margin-bottom:6px;
}
.btn-microsoft:hover { background:#f3f3f3; }
.btn-microsoft:focus-visible { outline:2px solid var(--teal-mid); outline-offset:2px; }
.ou { display:flex; align-items:center; gap:10px; margin:4px 0 16px; color:#94a3b8; font-size:.72rem; }
.ou::before, .ou::after { content:''; flex:1; height:1px; background:#e5e7eb; }
.abas { display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid #e5e7eb; }
.aba {
  flex:1; background:none; border:none; border-bottom:2px solid transparent;
  padding:9px 8px; font-size:.82rem; font-weight:600; color:#6b7280;
  cursor:pointer; border-radius:0; margin:0;
}
.aba:hover { background:#f9fafb; color:var(--teal-mid); }
.aba.ativa { color:var(--teal); border-bottom-color:var(--teal); }
/* o foco precisa aparecer: quem navega por teclado tem que enxergar onde está */
.aba:focus-visible { outline:2px solid var(--teal-mid); outline-offset:-2px; }
.sub { font-weight:400; color:#6b7280; font-size:.72rem; }
.erro {
  background: var(--red-l);
  border: 1px solid #fca5a5;
  color: var(--red);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: .78rem;
  margin-bottom: 14px;
}
</style>
</head>
<body>
<div class="card">
  <div class="brand">DATA SIN · Painel de Licitações</div>

  <a href="#" id="btn-microsoft" class="btn-microsoft">
    <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true" focusable="false">
      <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
      <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
      <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
      <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
    </svg>
    <span>Entrar com a conta Microsoft da empresa</span>
  </a>
  <p class="hint" style="text-align:center;margin:-6px 0 16px;">Recomendado — use seu e-mail <b id="dominio-ms">@sinape.com.br</b></p>
  <div class="ou"><span>ou</span></div>

  <div class="abas" role="tablist">
    <button type="button" class="aba ativa" id="aba-entrar" role="tab"
            aria-selected="true" aria-controls="painel-entrar" onclick="mostrar('entrar')">Entrar</button>
    <button type="button" class="aba" id="aba-criar" role="tab"
            aria-selected="false" aria-controls="painel-criar" onclick="mostrar('criar')">Criar conta</button>
  </div>

  <section id="painel-entrar" role="tabpanel" aria-labelledby="aba-entrar">
    <p class="hint">Entre com seu e-mail corporativo. Se ainda não tem conta, use a aba <b>Criar conta</b>.</p>
    <div id="login-erro" class="erro" style="display:none;">Usuário ou senha incorretos.</div>
    <form method="post" action="/login">
      <input type="hidden" name="next" id="next" value="/">
      <label for="usuario">E-mail</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus>
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
  </section>

  <section id="painel-criar" role="tabpanel" aria-labelledby="aba-criar" hidden>
    <p class="hint">Só e-mails <b id="dominio">@sinape.com.br</b>. A senha é sua — ninguém mais vê.</p>
    <div id="criar-erro" class="erro" style="display:none;"></div>
    <form id="form-criar" onsubmit="return criarConta(event)">
      <label for="c-nome">Seu nome</label>
      <input type="text" id="c-nome" autocomplete="name" required>
      <label for="c-email">E-mail corporativo</label>
      <input type="email" id="c-email" autocomplete="email" placeholder="nome@sinape.com.br" required>
      <label for="c-senha">Criar senha <span class="sub">(mínimo 10 caracteres)</span></label>
      <input type="password" id="c-senha" autocomplete="new-password" minlength="10" required>
      <label for="c-senha2">Repetir senha</label>
      <input type="password" id="c-senha2" autocomplete="new-password" minlength="10" required>
      <button type="submit" id="btn-criar">Criar conta e entrar</button>
    </form>
  </section>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const erro = params.get('erro');
if (erro) {
  const cx = document.getElementById('login-erro');
  // o servidor manda "1" para credencial errada e um texto quando quer explicar
  // (bloqueio por tentativas, por exemplo)
  cx.textContent = (erro === '1') ? 'E-mail ou senha incorretos.' : erro;
  cx.style.display = 'block';
}
const next = params.get('next');
if (next && next.startsWith('/') && !next.startsWith('//')) {
  document.getElementById('next').value = next;
}
document.getElementById('btn-microsoft').href =
  '/auth/entrar' + (next ? '?next=' + encodeURIComponent(next) : '');

function mostrar(qual){
  const entrar = qual === 'entrar';
  document.getElementById('painel-entrar').hidden = !entrar;
  document.getElementById('painel-criar').hidden = entrar;
  document.getElementById('aba-entrar').classList.toggle('ativa', entrar);
  document.getElementById('aba-criar').classList.toggle('ativa', !entrar);
  document.getElementById('aba-entrar').setAttribute('aria-selected', entrar);
  document.getElementById('aba-criar').setAttribute('aria-selected', !entrar);
  document.getElementById(entrar ? 'usuario' : 'c-nome').focus();
}

async function criarConta(ev){
  ev.preventDefault();
  const btn = document.getElementById('btn-criar');
  const cx = document.getElementById('criar-erro');
  cx.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Criando…';
  try{
    const r = await fetch('/registrar', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        nome: document.getElementById('c-nome').value,
        email: document.getElementById('c-email').value,
        senha: document.getElementById('c-senha').value,
        senha2: document.getElementById('c-senha2').value,
      })
    });
    const b = await r.json();
    if(!r.ok) throw new Error(b.erro || 'Não foi possível criar a conta.');
    // o servidor já abre a sessão: entra direto
    window.location.href = document.getElementById('next').value || '/';
  }catch(e){
    cx.textContent = e.message;
    cx.style.display = 'block';
    cx.setAttribute('role', 'alert');
    btn.disabled = false; btn.textContent = 'Criar conta e entrar';
  }
  return false;
}
</script>
</body>
</html>
